# EDITABLE BLOCK
# #################################################################################
server.port=8080

# OIDC provider. The defaults point at the Keycloak from docker-compose.yml, so local development
# needs no registration anywhere. Any other provider with a discovery document works: override the
# three OIDC_ variables and register http://localhost:5173/login/oauth2/code/oidc as redirect URI.
spring.security.oauth2.client.provider.oidc.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8180/realms/it-assistant}
spring.security.oauth2.client.registration.oidc.provider=oidc
spring.security.oauth2.client.registration.oidc.client-id=${OIDC_CLIENT_ID:it-assistant-web}
spring.security.oauth2.client.registration.oidc.client-secret=${OIDC_CLIENT_SECRET:local-dev-only-not-a-real-secret}
spring.security.oauth2.client.registration.oidc.client-name=Company SSO
spring.security.oauth2.client.registration.oidc.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.oidc.scope=openid,profile,email

openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# The MCP server runs as its own process.
mcp.kb-server.url=${MCP_KB_SERVER_URL:http://localhost:8081}
mcp.kb-server.endpoint=/mcp

# How many times the model may call tools before one run is stopped.
agent.max-tool-rounds=8
# How long a sensitive tool call waits for the user. A timeout counts as a denial.
agent.approval-timeout-seconds=300

# #################################################################################
# NOT EDITABLE BLOCK
# #################################################################################
spring.application.name=chat-backend
spring.main.banner-mode=off

# Lax is enough for the OIDC redirect back from the provider and blocks cross-site POSTs.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

logging.level.tech.itassistant=INFO
logging.level.io.modelcontextprotocol=INFO
