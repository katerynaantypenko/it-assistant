# #################################################################################
# EDITABLE BLOCK
# #################################################################################
server.port=8081

# Directory with the knowledge base markdown files. New articles are written here too.
knowledge-base.path=${KNOWLEDGE_BASE_PATH:../knowledge-base}

# OIDC provider that issued the user's access token. The audience is this service, not the web
# client: the provider is configured to name mcp-kb-server in the tokens it hands to the chat
# backend, so a token minted for some other API cannot be replayed here.
security.oidc.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8180/realms/it-assistant}
security.oidc.audience=${MCP_TOKEN_AUDIENCE:mcp-kb-server}

# #################################################################################
# NOT EDITABLE BLOCK
# #################################################################################
spring.application.name=mcp-kb-server
spring.main.banner-mode=off

logging.level.tech.itassistant=INFO
logging.level.io.modelcontextprotocol=INFO
